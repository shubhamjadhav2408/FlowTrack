<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C97E"/>
      <stop offset="100%" stop-color="#B8935A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4CAF7D"/>
      <stop offset="100%" stop-color="#6FCFA0"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E07070"/>
      <stop offset="100%" stop-color="#C85555"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="8" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
  <!-- Gold coin circle -->
  <circle cx="16" cy="13" r="7" fill="url(#gold)" opacity="0.15"/>
  <circle cx="16" cy="13" r="6" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <!-- Dollar sign -->
  <text x="16" y="17.5" text-anchor="middle" fill="url(#gold)" font-size="9" font-weight="700" font-family="-apple-system,sans-serif">$</text>
  <!-- Up arrow (income) -->
  <path d="M10 24 L10 22 L7 22 L10 19 L13 22 L10 22" fill="url(#green)" opacity="0.9"/>
  <!-- Down arrow (expense) -->
  <path d="M22 19 L22 21 L25 21 L22 24 L19 21 L22 21" fill="url(#red)" opacity="0.9"/>
</svg>